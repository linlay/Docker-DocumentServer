location ~ "^/(docx|xlsx|pptx)/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" {
  proxy_pass http://127.0.0.1:3001;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 30s;
}

location ~ ^/new-(docx|xlsx|pptx)$ {
  client_max_body_size 1k;
  proxy_pass http://127.0.0.1:3001;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  # 3001 只监听容器回环；覆盖客户端提供的 X-Forwarded-For，避免绕过限流。
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /documents/editor {
  proxy_pass http://127.0.0.1:3001;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /admin {
  return 308 /admin/;
}

location = /admin/ {
  proxy_pass http://127.0.0.1:3001;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /__document_storage/ {
  allow 127.0.0.1;
  allow ::1;
  deny all;

  client_max_body_size 2m;
  proxy_pass http://127.0.0.1:3001/documents/storage/;
  proxy_http_version 1.1;
  proxy_set_header Host 127.0.0.1;
  proxy_set_header X-Forwarded-For 127.0.0.1;
  proxy_set_header X-Forwarded-Proto http;
  proxy_read_timeout 60s;
}

location ^~ /__document_files/ {
  internal;
  alias /var/lib/onlyoffice/copilot/documents/;
  add_header X-Content-Type-Options nosniff always;
}

location /copilot-api/ {
  client_max_body_size 12m;
  proxy_pass http://127.0.0.1:3001/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 120s;
}
