location ~ "^/(docx|xlsx|pptx)/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" {
  proxy_pass http://127.0.0.1:3001;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/new-(docx|xlsx|pptx)$ {
  client_max_body_size 1k;
  proxy_pass http://127.0.0.1:3001;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  # 3001 只监听容器回环；覆盖客户端提供的 X-Forwarded-For，避免绕过限流。
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /admin {
  return 308 /admin/;
}

location = /admin/ {
  proxy_pass http://127.0.0.1:3001;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ "^/__document_editor/(?<document_type>docx|xlsx|pptx)/(?<document_id>[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})$" {
  internal;
  absolute_redirect off;
  proxy_pass http://example/editor?fileName=$document_id.$document_type&lang=zh;
  proxy_intercept_errors on;
  error_page 502 503 504 /welcome/example-disabled.html;

  proxy_set_header X-Forwarded-Host $the_host;
  proxy_set_header X-Forwarded-Proto $the_scheme;
  proxy_set_header X-Forwarded-Path /__document_storage;
  proxy_set_header X-Forwarded-For 185.199.108.133;
  proxy_set_header Accept-Encoding "";

  sub_filter_once on;
  sub_filter '<option value="zh">zh</option>' '<option value="zh" selected>zh</option>';
  sub_filter '<option value="uid-0">Anonymous</option>' '<option value="uid-0" selected>访客</option>';
  sub_filter '        config.events = {' '        config.editorConfig.customization = config.editorConfig.customization || {}; config.editorConfig.customization.compactToolbar = true; config.editorConfig.customization.layout = config.editorConfig.customization.layout || {}; config.editorConfig.customization.layout.leftMenu = false; config.editorConfig.customization.layout.toolbar = Object.assign({}, config.editorConfig.customization.layout.toolbar, { collaboration: false, plugins: false }); var aiBridgeChannelId = window.crypto && typeof window.crypto.randomUUID === "function" ? window.crypto.randomUUID() : "channel-" + Date.now() + "-" + Math.random().toString(16).slice(2); config.editorConfig.plugins = { pluginsData: [window.location.origin + "/sdkjs-plugins/{A17E5F31-64AA-4E37-9A42-8D430814C2F6}/config.json?v=0.4.0-rev30"], autostart: ["asc.{A17E5F31-64AA-4E37-9A42-8D430814C2F6}"], options: { "asc.{A17E5F31-64AA-4E37-9A42-8D430814C2F6}": { hostOrigin: window.location.origin, channelId: aiBridgeChannelId } } }; config.events = {';
  sub_filter '        var connectEditor = function () {' '        var connectEditor = async function () { if (!(await window.OnlyOfficeLocalGuest.prepareExample(config))) return;';
  sub_filter '</body>' '<script src="/sdkjs-plugins/{A17E5F31-64AA-4E37-9A42-8D430814C2F6}/local-guest.js?v=0.4.0-rev30"></script><script src="/sdkjs-plugins/{A17E5F31-64AA-4E37-9A42-8D430814C2F6}/host-bridge.js?v=0.4.0-rev30"></script></body>';
}

location ^~ /__document_storage/ {
  allow 127.0.0.1;
  allow ::1;
  deny all;

  proxy_pass http://example/;
  proxy_http_version 1.1;
  proxy_set_header X-Forwarded-Host $the_host;
  proxy_set_header X-Forwarded-Proto $the_scheme;
  proxy_set_header X-Forwarded-Path /__document_storage;
  proxy_set_header X-Forwarded-For 185.199.108.133;
}

location = /example {
  return 404;
}

location ^~ /example/ {
  return 404;
}

location ~ ^(\/welcome\/.*)$ {
  expires 365d;
  alias /var/www/onlyoffice/documentserver-example$1;
  index docker.html;
}

location /copilot-api/ {
  client_max_body_size 12m;
  proxy_pass http://127.0.0.1:3001/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 120s;
}
