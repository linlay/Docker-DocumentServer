location ~ ^(\/welcome\/.*)$ {
  expires 365d;
  alias /var/www/onlyoffice/documentserver-example$1;
  index docker.html;
}

location /example/ {
  proxy_pass http://example/;
  proxy_intercept_errors on;
  error_page 502 503 504 /welcome/example-disabled.html;

  proxy_set_header X-Forwarded-Host $the_host;
  proxy_set_header X-Forwarded-Proto $the_scheme;
  proxy_set_header X-Forwarded-Path /example;
  # Keep the existing example storage identity stable even though the demo
  # ports are intentionally bound to host loopback.
  proxy_set_header X-Forwarded-For 185.199.108.133;
  proxy_set_header Accept-Encoding "";

  sub_filter_once on;
  sub_filter '        config.events = {' '        config.editorConfig.customization = config.editorConfig.customization || {}; config.editorConfig.customization.compactToolbar = true; config.editorConfig.customization.layout = config.editorConfig.customization.layout || {}; config.editorConfig.customization.layout.leftMenu = false; config.editorConfig.customization.layout.toolbar = Object.assign({}, config.editorConfig.customization.layout.toolbar, { collaboration: false, plugins: false }); config.editorConfig.plugins = { pluginsData: [window.location.origin + "/sdkjs-plugins/{A17E5F31-64AA-4E37-9A42-8D430814C2F6}/config.json?v=0.2.0-rev19"], autostart: ["asc.{A17E5F31-64AA-4E37-9A42-8D430814C2F6}"] }; config.events = {';
  sub_filter '</body>' '<script src="/sdkjs-plugins/{A17E5F31-64AA-4E37-9A42-8D430814C2F6}/host-bridge.js?v=0.2.0-rev19"></script></body>';
}

location /copilot-api/ {
  proxy_pass http://127.0.0.1:3001/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 120s;
}
