# Docker publishes host port 8088 to container port 80. The example app uses
# the browser's Host header in document and callback URLs, so a browser opened
# on localhost:8088 makes DocService call localhost:8088 from inside the
# container. Provide that internal port without changing browser-facing URLs.
server {
  listen 127.0.0.1:8088;
  server_name localhost 127.0.0.1;

  location / {
    proxy_pass http://127.0.0.1:80;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
