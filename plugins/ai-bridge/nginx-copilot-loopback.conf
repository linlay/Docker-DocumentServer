# Docker publishes DOCUMENTSERVER_HTTP_PORT to container port 80. The example
# app uses the browser's Host header in document and callback URLs, so
# DocService calls that same port from inside the container. Compose replaces
# this placeholder at startup to provide the internal loopback route without
# changing browser-facing URLs.
server {
  listen 127.0.0.1:__DOCUMENTSERVER_HTTP_PORT__;
  server_name localhost 127.0.0.1;

  location / {
    proxy_pass http://127.0.0.1:80;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
