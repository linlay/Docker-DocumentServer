[program:ds-copilot]
command=/usr/bin/python3 /opt/onlyoffice-copilot/copilot_server.py
directory=/opt/onlyoffice-copilot
user=ds
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/onlyoffice/documentserver/copilot.out.log
stderr_logfile=/var/log/onlyoffice/documentserver/copilot.err.log
environment=PYTHONUNBUFFERED="1"
