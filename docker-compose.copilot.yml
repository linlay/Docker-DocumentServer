services:
  onlyoffice-documentserver:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice-documentserver
    restart: always
    entrypoint:
      - /bin/bash
      - -c
      - >-
        umask 077 &&
        case "$${DOCUMENTSERVER_HTTP_PORT}" in
          ""|*[!0-9]*) echo "DOCUMENTSERVER_HTTP_PORT must be a numeric port" >&2; exit 64 ;;
        esac &&
        if [ "$${DOCUMENTSERVER_HTTP_PORT}" -lt 1 ] ||
           [ "$${DOCUMENTSERVER_HTTP_PORT}" -gt 65535 ]; then
          echo "DOCUMENTSERVER_HTTP_PORT must be between 1 and 65535" >&2;
          exit 64;
        fi &&
        JWT_SECRET="$$(tr -d '\r\n' < /run/secrets/onlyoffice_jwt_secret)" &&
        if [ "$${#JWT_SECRET}" -lt 32 ]; then
          echo "ONLYOFFICE JWT secret must contain at least 32 bytes" >&2;
          exit 78;
        fi &&
        export JWT_SECRET &&
        install -d -o ds -g ds -m 0755
        /var/lib/onlyoffice/copilot/documents &&
        /usr/bin/printf '%s\0'
        "JWT_SECRET=$${JWT_SECRET}"
        "AI_RELAY_INTERNAL_SECRET_FILE=/run/secrets/ai_relay_internal_secret"
        "COPILOT_BIND_ADDRESS=0.0.0.0"
        "ALLOW_LEGACY_UUID_ATTACH=false"
        > /run/onlyoffice-copilot.env &&
        chown ds:ds /run/onlyoffice-copilot.env &&
        install -m 0644 /opt/onlyoffice-copilot/nginx-document-app.conf
        /etc/nginx/includes/ds-copilot.conf &&
        if [ -L /etc/nginx/includes/ds-example.conf ]; then
          unlink /etc/nginx/includes/ds-example.conf;
        fi &&
        exec /app/ds/run-document-server.sh
    ports:
      # Bind only on host loopback; the host reverse proxy owns public ingress.
      - "127.0.0.1:${DOCUMENTSERVER_HTTP_PORT:-8091}:80"
    environment:
      DOCUMENTSERVER_HTTP_PORT: "${DOCUMENTSERVER_HTTP_PORT:-8091}"
      EXAMPLE_ENABLED: "false"
      PLUGINS_ENABLED: "${ONLYOFFICE_DEFAULT_PLUGINS_ENABLED:-false}"
      JWT_ENABLED: "true"
      JWT_IN_BODY: "true"
      COPILOT_BIND_ADDRESS: "0.0.0.0"
      AI_RELAY_INTERNAL_SECRET_FILE: "/run/secrets/ai_relay_internal_secret"
      ALLOW_LEGACY_UUID_ATTACH: "false"
    expose:
      - "3001"
    secrets:
      - onlyoffice_jwt_secret
      - ai_relay_internal_secret
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/info/info.json"]
      interval: 30s
      retries: 5
      start_period: 60s
      timeout: 10s
    stop_grace_period: 60s
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_lib:/var/lib/onlyoffice
      - onlyoffice_fonts:/usr/share/fonts/truetype/custom
      - "./plugins/ai-bridge:/var/www/onlyoffice/documentserver/sdkjs-plugins/{A17E5F31-64AA-4E37-9A42-8D430814C2F6}:ro"
      - "./plugins/ai-bridge/nginx-document-app.conf:/opt/onlyoffice-copilot/nginx-document-app.conf:ro"
      - "./plugins/ai-bridge/copilot_server.py:/opt/onlyoffice-copilot/copilot_server.py:ro"
      - "./plugins/ai-bridge/run-copilot.sh:/opt/onlyoffice-copilot/run-copilot.sh:ro"
      - "./plugins/ai-bridge/supervisor-ds-copilot.conf:/etc/supervisor/conf.d/ds-copilot.conf:ro"

volumes:
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_lib:
  onlyoffice_fonts:

secrets:
  onlyoffice_jwt_secret:
    file: "${ONLYOFFICE_JWT_SECRET_FILE:?set ONLYOFFICE_JWT_SECRET_FILE}"
  ai_relay_internal_secret:
    file: "${AI_RELAY_INTERNAL_SECRET_FILE:?set AI_RELAY_INTERNAL_SECRET_FILE}"
