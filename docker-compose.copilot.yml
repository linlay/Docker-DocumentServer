services:
  onlyoffice-documentserver:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice-documentserver
    restart: always
    entrypoint:
      - /bin/bash
      - -c
      - >-
        umask 077 &&
        case "$${DOCUMENTSERVER_HTTP_PORT}" in
          ""|*[!0-9]*) echo "DOCUMENTSERVER_HTTP_PORT must be a numeric port" >&2; exit 64 ;;
        esac &&
        if [ "$${DOCUMENTSERVER_HTTP_PORT}" -lt 1 ] ||
           [ "$${DOCUMENTSERVER_HTTP_PORT}" -gt 65535 ]; then
          echo "DOCUMENTSERVER_HTTP_PORT must be between 1 and 65535" >&2;
          exit 64;
        fi &&
        install -d -o ds -g ds -m 0755
        /var/lib/onlyoffice/documentserver-example/files &&
        /usr/bin/printf '%s\0'
        "COPILOT_API_BASE=$${COPILOT_API_BASE}"
        "COPILOT_API_KEY=$${COPILOT_API_KEY}"
        "COPILOT_MODEL=$${COPILOT_MODEL}"
        "JWT_SECRET=$${JWT_SECRET}"
        "DOCUMENT_PUBLIC_ORIGIN=$${DOCUMENT_PUBLIC_ORIGIN}"
        "DOCUMENT_ADMIN_USERNAME=$${DOCUMENT_ADMIN_USERNAME}"
        "DOCUMENT_ADMIN_PASSWORD=$${DOCUMENT_ADMIN_PASSWORD}"
        > /run/onlyoffice-copilot.env &&
        chown ds:ds /run/onlyoffice-copilot.env &&
        cp /opt/onlyoffice-copilot/nginx-ds-example.conf
        /etc/onlyoffice/documentserver-example/nginx/includes/ds-example.conf &&
        sed "s/__DOCUMENTSERVER_HTTP_PORT__/$${DOCUMENTSERVER_HTTP_PORT}/g"
        /opt/onlyoffice-copilot/nginx-copilot-loopback.conf
        > /etc/nginx/conf.d/copilot-loopback.conf &&
        exec /app/ds/run-document-server.sh
    ports:
      # Bind only on host loopback; the host reverse proxy owns public ingress.
      - "127.0.0.1:${DOCUMENTSERVER_HTTP_PORT:-8088}:80"
      - "127.0.0.1:${DOCUMENTSERVER_HTTPS_PORT:-8443}:443"
    environment:
      DOCUMENTSERVER_HTTP_PORT: "${DOCUMENTSERVER_HTTP_PORT:-8088}"
      EXAMPLE_ENABLED: "true"
      PLUGINS_ENABLED: "${ONLYOFFICE_DEFAULT_PLUGINS_ENABLED:-false}"
      JWT_ENABLED: "true"
      JWT_SECRET: "${ONLYOFFICE_JWT_SECRET:-onlyoffice-copilot-local}"
      JWT_IN_BODY: "true"
      COPILOT_API_BASE: "${COPILOT_API_BASE:-https://api.openai.com/v1}"
      COPILOT_API_KEY: "${COPILOT_API_KEY:-}"
      COPILOT_MODEL: "${COPILOT_MODEL:-}"
      DOCUMENT_PUBLIC_ORIGIN: "${DOCUMENT_PUBLIC_ORIGIN:-http://localhost:8088}"
      DOCUMENT_ADMIN_USERNAME: "${DOCUMENT_ADMIN_USERNAME:-}"
      DOCUMENT_ADMIN_PASSWORD: "${DOCUMENT_ADMIN_PASSWORD:-}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/info/info.json"]
      interval: 30s
      retries: 5
      start_period: 60s
      timeout: 10s
    stop_grace_period: 60s
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_lib:/var/lib/onlyoffice
      - onlyoffice_fonts:/usr/share/fonts/truetype/custom
      # Keep generated documents in a project-visible host directory.
      - "./data/documents:/var/lib/onlyoffice/documentserver-example/files"
      - "./plugins/ai-bridge:/var/www/onlyoffice/documentserver/sdkjs-plugins/{A17E5F31-64AA-4E37-9A42-8D430814C2F6}:ro"
      - "./plugins/ai-bridge/nginx-ds-example.conf:/opt/onlyoffice-copilot/nginx-ds-example.conf:ro"
      - "./plugins/ai-bridge/nginx-copilot-loopback.conf:/opt/onlyoffice-copilot/nginx-copilot-loopback.conf:ro"
      - "./plugins/ai-bridge/copilot_server.py:/opt/onlyoffice-copilot/copilot_server.py:ro"
      - "./plugins/ai-bridge/run-copilot.sh:/opt/onlyoffice-copilot/run-copilot.sh:ro"
      - "./plugins/ai-bridge/supervisor-ds-copilot.conf:/etc/supervisor/conf.d/ds-copilot.conf:ro"

volumes:
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_lib:
  onlyoffice_fonts:
